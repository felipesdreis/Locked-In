name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:single -- --browsers=ChromeHeadless --browser-no-activity-timeout=60000
        env:
          CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"

      - name: Build
        run: npm run build
