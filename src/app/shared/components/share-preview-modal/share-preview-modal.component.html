<div class="share-overlay" (click)="close()">
  <div class="share-card" (click)="$event.stopPropagation()">
    <h3 class="share-title">Compartilhar progresso</h3>

    <div class="preview-area">
      @if (isLoading()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else if (imageUrl()) {
        <img [src]="imageUrl()!" alt="Preview do progresso" class="preview-image" />
      } @else {
        <p class="preview-error">Não foi possível gerar a imagem.</p>
      }
    </div>

    <div class="share-actions">
      <ion-button fill="outline" (click)="close()">Cancelar</ion-button>
      <ion-button [disabled]="isLoading() || isSharing() || !imageUrl()" (click)="shareImage()">
        @if (isSharing()) {
          <ion-spinner name="crescent" slot="start"></ion-spinner>
        }
        Compartilhar
      </ion-button>
    </div>
  </div>
</div>
