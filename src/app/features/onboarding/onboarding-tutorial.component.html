<div class="onboarding-overlay">
  <div class="onboarding-card">

    <div class="slide-content">
      <ion-icon [name]="currentSlide.icon" class="slide-icon"></ion-icon>
      <h2 class="slide-title">{{ currentSlide.title }}</h2>
      <p class="slide-text">{{ currentSlide.text }}</p>
    </div>

    <div class="dots">
      @for (slide of slides; track $index) {
        <span class="dot" [class.active]="$index === currentIndex()"></span>
      }
    </div>

    <div class="slide-actions">
      @if (!isLastSlide) {
        <ion-button fill="clear" class="skip-btn" (click)="skip()">Pular</ion-button>
      }

      @if (!isFirstSlide) {
        <ion-button fill="outline" (click)="prev()">Anterior</ion-button>
      }

      @if (!isLastSlide) {
        <ion-button (click)="next()">Próximo</ion-button>
      } @else {
        <ion-button expand="block" class="start-btn" (click)="complete()">Começar</ion-button>
      }
    </div>

  </div>
</div>
