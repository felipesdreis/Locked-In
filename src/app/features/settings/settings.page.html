<app-screen-header title="CONFIGURAÇÕES" [showBack]="true"></app-screen-header>

<ion-content>
  <div class="settings-container">

    <!-- GRUPO: DADOS -->
    <section class="settings-group">
      <h3 class="group-label">DADOS</h3>
      <div class="settings-card">
        <button
          class="settings-row"
          (click)="exportData()"
          [disabled]="exporting()"
          type="button"
        >
          <div class="row-icon">
            <app-icon name="archive" [size]="22"></app-icon>
          </div>
          <div class="row-content">
            <div class="row-title">{{ exporting() ? 'Exportando...' : 'Exportar Backup' }}</div>
            <div class="row-subtitle">Baixar seus hábitos em JSON</div>
          </div>
          <app-icon name="chevR" [size]="18" color="var(--faint)"></app-icon>
        </button>
      </div>
    </section>

    <!-- GRUPO: LEMBRETE DIÁRIO -->
    <section class="settings-group">
      <h3 class="group-label">LEMBRETE DIÁRIO</h3>
      <div class="settings-card">
        <div class="settings-row no-chevron">
          <div class="row-icon">
            <app-icon name="clock" [size]="22"></app-icon>
          </div>
          <div class="row-content">
            <div class="row-title">Lembrete Diário</div>
            <div class="row-subtitle">Lembrar de verificar seus hábitos</div>
          </div>
          <ion-toggle
            [checked]="dailyReminderEnabled()"
            (ionChange)="onReminderToggle($event)"
            aria-label="Ativar lembrete diário"
          ></ion-toggle>
        </div>
        <div class="row-divider" *ngIf="dailyReminderEnabled()"></div>
        <div class="settings-row no-chevron reminder-time-row" *ngIf="dailyReminderEnabled()">
          <div class="row-content">
            <div class="row-title">Horário</div>
          </div>
          <input
            type="time"
            class="time-input"
            [value]="dailyReminderTime()"
            (change)="onReminderTimeChange($event)"
            aria-label="Horário do lembrete diário"
          />
        </div>
      </div>
    </section>

    <!-- GRUPO: SOBRE -->
    <section class="settings-group">
      <h3 class="group-label">SOBRE O APP</h3>
      <div class="about-card">
        <app-court-mark opacity="0.08"></app-court-mark>
        <div class="about-content">
          <app-wordmark [size]="28"></app-wordmark>
          <div class="app-version">v{{ appVersion }}</div>
          <p class="app-tagline">Enter the zone. Stay locked in.</p>
          <p class="app-desc">100% privado · sem conta · sempre offline</p>
        </div>
      </div>
    </section>

    <!-- GRUPO: AVALIAÇÕES -->
    <section class="settings-group">
      <h3 class="group-label">AVALIAÇÕES</h3>
      <div class="settings-card">
        <button
          class="settings-row"
          (click)="openLink('https://play.google.com/store/apps/details?id=br.fdrapps.lockedin&hl=pt_BR')"
          type="button"
        >
          <div class="row-icon">
            <app-icon name="edit" [size]="22"></app-icon>
          </div>
          <div class="row-content">
            <div class="row-title">Avaliar o App</div>
            <div class="row-subtitle">Deixe sua avaliação na Play Store</div>
          </div>
          <app-icon name="chevR" [size]="18" color="var(--faint)"></app-icon>
        </button>
      </div>
    </section>

    <!-- GRUPO: LINKS -->
    <section class="settings-group">
      <h3 class="group-label">LINKS</h3>
      <div class="settings-card">
        <button
          class="settings-row"
          (click)="openLink('https://www.felipedosreis.com.br/locked-in#download')"
          type="button"
        >
          <div class="row-icon">
            <app-icon name="target" [size]="22"></app-icon>
          </div>
          <div class="row-content">
            <div class="row-title">Site Oficial</div>
            <div class="row-subtitle">Conheça o app</div>
          </div>
          <app-icon name="chevR" [size]="18" color="var(--faint)"></app-icon>
        </button>
        <div class="row-divider"></div>
        <button
          class="settings-row"
          (click)="openLink('https://play.google.com/store/apps/details?id=br.fdrapps.lockedin&hl=pt_BR')"
          type="button"
        >
          <div class="row-icon">
            <app-icon name="hoop" [size]="22"></app-icon>
          </div>
          <div class="row-content">
            <div class="row-title">Avaliar na Play Store</div>
            <div class="row-subtitle">Deixe sua avaliação</div>
          </div>
          <app-icon name="chevR" [size]="18" color="var(--faint)"></app-icon>
        </button>
      </div>
    </section>

    <!-- Bottom padding -->
    <div style="height: 32px"></div>
  </div>
</ion-content>
