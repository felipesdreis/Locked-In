<app-screen-header
  [title]="editId ? 'EDITAR HÁBITO' : 'NOVO HÁBITO'"
  [showBack]="true"
>
  <button
    *ngIf="editId"
    slot="actions"
    class="trash-btn"
    (click)="onDelete()"
    type="button"
    aria-label="Excluir hábito"
  >
    <app-icon name="trash" [size]="22" color="var(--accent)"></app-icon>
  </button>
</app-screen-header>

<ion-content>
  <div class="form-container">
    @if (form) {
    <form [formGroup]="form" (ngSubmit)="save()">

      <!-- NOME -->
      <div class="form-group">
        <label class="form-label" for="habit-name">Nome do Hábito</label>
        <div class="input-card" [class.field-error]="nameControl.invalid && nameControl.touched">
          <input
            id="habit-name"
            type="text"
            formControlName="name"
            placeholder="Ex: Beber água"
            class="form-input"
            autocomplete="off"
          />
        </div>
        <div class="error-msg" *ngIf="nameControl.touched && nameControl.hasError('required')">
          Nome é obrigatório
        </div>
        <div class="error-msg" *ngIf="nameControl.touched && nameControl.hasError('maxlength')">
          Nome deve ter no máximo 50 caracteres
        </div>
      </div>

      <!-- FREQUÊNCIA -->
      <div class="form-group">
        <label class="form-label">Frequência</label>
        <div class="segmented-control">
          <button
            *ngFor="let opt of frequencyOptions"
            type="button"
            class="seg-option"
            [class.active]="selectedFrequency === opt.value"
            (click)="selectFrequency(opt.value)"
          >
            {{ opt.label }}
          </button>
        </div>
        <div class="seg-help">{{ frequencyHint }}</div>

        <!-- Custom days picker -->
        <div class="day-picker" *ngIf="isCustomFrequency">
          <div class="day-chips">
            <button
              *ngFor="let day of weekDays"
              type="button"
              class="day-chip"
              [class.selected]="isDaySelected(day.value)"
              (click)="toggleDay(day.value)"
            >
              {{ day.label }}
            </button>
          </div>
          <div class="error-msg" *ngIf="form.get('frequencyDays')?.touched && form.get('frequencyDays')?.hasError('noDaySelected')">
            Selecione pelo menos um dia
          </div>
        </div>

        <!-- X per week count -->
        <div class="input-card" *ngIf="isXPerWeek" style="margin-top: 8px">
          <input
            type="number"
            formControlName="xPerWeekCount"
            class="form-input"
            min="1"
            max="7"
            placeholder="Ex: 3"
          />
        </div>
      </div>

      <!-- LEMBRETE -->
      <div class="form-group">
        <label class="form-label" for="habit-reminder">Lembrete (opcional)</label>
        <div class="input-card">
          <input
            id="habit-reminder"
            type="time"
            formControlName="reminderTime"
            class="form-input"
          />
        </div>
      </div>

      <!-- ÍCONE -->
      <div class="form-group">
        <label class="form-label">Ícone do Hábito</label>
        <div class="icon-grid">
          <button
            *ngFor="let iconName of icons"
            type="button"
            class="icon-cell"
            [class.selected]="selectedIcon === iconName"
            (click)="selectIcon(iconName)"
            [attr.aria-label]="'Ícone ' + iconName"
            [attr.aria-pressed]="selectedIcon === iconName"
          >
            <app-icon [name]="iconName" [size]="26" [stroke]="2"></app-icon>
          </button>
        </div>
      </div>

      <!-- BANNER decorativo -->
      <div class="banner">
        <div class="banner-hoop">
          <app-icon name="hoop" [size]="30" color="var(--accent)"></app-icon>
        </div>
        <div class="banner-text">Uma só cor de ação. Sem distração.</div>
      </div>

      <!-- BOTÃO SALVAR -->
      <button
        type="submit"
        class="btn-primary"
        [disabled]="!isFormValid"
      >
        {{ editId ? 'ATUALIZAR' : 'CRIAR HÁBITO' }}
      </button>

    </form>
    }
  </div>
</ion-content>
